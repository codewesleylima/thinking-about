name: YZZY BLACK CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run evaluate
      - run: npm pack --ignore-scripts
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.os }}
          path: evaluations/results/latest.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker pull node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
      - run: npm run test:docker
      - run: docker pull node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
      - run: npm run test:evolution:docker
      - run: npm run test:evolution:checkout
      - run: npm run test:capabilities:docker
